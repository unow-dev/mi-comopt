issue: cumulative-corpus-update
status: implementation-ready
invariant:
  deployed_population: existing_valid_plus_incoming_minus_exact_duplicates
corpus:
  schema_version: 2
  snapshot_ref_identity: [payloadSha256, snapshotIndex]
  update: append_prior_then_incoming_first_unique
projection:
  snapshot_order: corpus_state_order
  observation_order: source_index_asc
  dedupe:
    strategy: first_wins
    fields: [username, handle, comment, postedAt, postedDate]
    normalization: none
classification:
  authority: classification_state_labels
  resolution_order:
    - exact_observation_id
    - prior_same_comment_text
    - human_decision
  chatgpt_handoff_assertion:
    exact_prior_label_must_be_absent: true
    prior_comment_label_must_be_absent: true
    error_code: CLASSIFICATION_WORKSET_CONTAINS_PREVIOUSLY_RESOLVED_ITEM
  output_must_cover_all_survivors: true
source_dataset:
  schema_version: 2
  authority_for_downstream: true
release:
  fail_closed_cross_pins: true
  fail_closed_source_sha: true
  arbitrary_request_artifact_override: false
recovery:
  required_for_existing_broken_head: true
  explicit_inputs:
    - baseCorpusVersionId
    - brokenHeadCorpusVersionId
  historical_scan: recovery_only
  rollback_to_broken_semantics: false
production_cutover:
  source_dataset_v2_and_downstream: atomic_visibility
