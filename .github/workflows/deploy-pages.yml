name: Deploy React UI to GitHub Pages

run-name: Deploy React UI to GitHub Pages / ${{ inputs.deployment_request_id || github.sha }}

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deployment_request_id:
        description: v3 deployment request identity
        required: true
        type: string
      release_id:
        description: v3 release identity
        required: true
        type: string
      release_bundle_sha256:
        description: v3 release bundle SHA-256 without the sha256 prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned Work Orchestrator provider
        uses: actions/checkout@v4
        with:
          repository: unow-dev/work-orchestrator
          ref: 3a6359fbdb44c3d2189ba63ce0215b07b4b2aadc
          path: work-orchestrator
          token: ${{ secrets.WORK_ORCHESTRATOR_REPO_TOKEN }}

      - name: Build Work Orchestrator provider
        working-directory: work-orchestrator/package
        run: npm ci && npm run build

      - name: Link provider workspace dependency
        run: ln -s "$GITHUB_WORKSPACE/work-orchestrator" "$GITHUB_WORKSPACE/../work-orchestrator"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Integrated Labeling tests
        run: python3 'docs/active/operations/Integrated_Labeling_Handoff_v1.4 (2).0/tests/run_all_tests.py'

      - name: Run Node tests
        run: npm test

      - name: Verify account data
        run: npm run verify:data

      - name: Verify UI release
        run: npm --workspace package run verify:optimicom-ui-release -- --release ../docs/active/temp/optimicom-react-tailwind/public/optimicom-ui-release.json

      - name: Write v3 deployment identity
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOYMENT_REQUEST_ID: ${{ inputs.deployment_request_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_BUNDLE_SHA256: ${{ inputs.release_bundle_sha256 }}
        run: >-
          node package/scripts/write-pages-deployment-marker.mjs
          --output-root docs/active/temp/optimicom-react-tailwind/public
          --deployment-request-id "$DEPLOYMENT_REQUEST_ID"
          --release-id "$RELEASE_ID"
          --release-bundle-sha256 "$RELEASE_BUNDLE_SHA256"

      - name: Build React UI
        run: npm run build

      - name: Upload build output for Pages
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: package/dist
          if-no-files-found: error

  deploy:
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: package/dist

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: package/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed UI release identity
        run: >-
          npm --workspace package run verify:deployed-optimicom-ui-release --
          --url '${{ steps.deployment.outputs.page_url }}'
          --expected ../docs/active/temp/optimicom-react-tailwind/public/optimicom-ui-release.json

      - name: Verify deployed v3 identity
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOYMENT_REQUEST_ID: ${{ inputs.deployment_request_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_BUNDLE_SHA256: ${{ inputs.release_bundle_sha256 }}
        run: >-
          node package/scripts/verify-deployed-v3-pages.mjs
          --url '${{ steps.deployment.outputs.page_url }}'
          --deployment-request-id "$DEPLOYMENT_REQUEST_ID"
          --release-id "$RELEASE_ID"
          --release-bundle-sha256 "$RELEASE_BUNDLE_SHA256"
